<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaga 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Courier New", monospace; color: #fff; }
  #hud { position: fixed; top: 10px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; font-size: 20px; pointer-events: none; text-shadow: 0 0 6px #f33; }
  #hud .red { color: #f44; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
  #msg h1 { font-size: 56px; margin: 0 0 12px; color: #4cf; text-shadow: 0 0 16px #4cf; letter-spacing: 6px; }
  #msg p { font-size: 18px; margin: 6px; color: #ff6; }
  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="hud">
  <div><span class="red">1UP</span> <span id="score">0</span></div>
  <div><span class="red">HIGH SCORE</span> <span id="hi">0</span></div>
  <div>STAGE <span id="stage">1</span> &nbsp; <span id="lives"></span></div>
</div>
<div id="msg">
  <h1>GALAGA 3D</h1>
  <p>← → / A D : 이동 &nbsp;&nbsp; SPACE : 발사</p>
  <p class="blink">PRESS SPACE TO START</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- 기본 설정 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 60, 130);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 15, 13);
camera.lookAt(0, 0, -22);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(5, 20, 10);
scene.add(sun);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- 별 배경 ----------
const STAR_N = 900;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(STAR_N * 3);
for (let i = 0; i < STAR_N; i++) {
  starPos[i * 3] = (Math.random() - 0.5) * 160;
  starPos[i * 3 + 1] = -20 + Math.random() * 60;
  starPos[i * 3 + 2] = -150 + Math.random() * 170;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35 })));

// ---------- 사운드 ----------
let actx = null;
function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, actx.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), actx.currentTime + dur);
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g).connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}

// ---------- 모델 ----------
function makePlayer() {
  const g = new THREE.Group();
  const white = new THREE.MeshPhongMaterial({ color: 0xeeeeee, flatShading: true });
  const red = new THREE.MeshPhongMaterial({ color: 0xff2222, flatShading: true });
  const blue = new THREE.MeshPhongMaterial({ color: 0x3366ff, emissive: 0x112244, flatShading: true });
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.6, 2.4, 6), white);
  body.rotation.x = -Math.PI / 2;
  g.add(body);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.15, 0.8), red);
  wing.position.z = 0.5; g.add(wing);
  for (const s of [-1, 1]) {
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1.2, 4), white);
    tip.rotation.x = -Math.PI / 2; tip.position.set(s * 1.5, 0, 0.2); g.add(tip);
  }
  const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), blue);
  cockpit.position.set(0, 0.35, 0.1); g.add(cockpit);
  return g;
}

const ENEMY_TYPES = {
  boss: { body: 0x22aa44, wing: 0x8844ff, score: 150, hp: 2 },
  butterfly: { body: 0xff3333, wing: 0x3388ff, score: 80, hp: 1 },
  bee: { body: 0x3366ff, wing: 0xffdd22, score: 50, hp: 1 },
};
function makeEnemy(type) {
  const t = ENEMY_TYPES[type];
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshPhongMaterial({ color: t.body, emissive: t.body, emissiveIntensity: 0.25, flatShading: true });
  const wingMat = new THREE.MeshPhongMaterial({ color: t.wing, emissive: t.wing, emissiveIntensity: 0.25, flatShading: true, side: THREE.DoubleSide });
  const size = type === 'boss' ? 0.8 : 0.6;
  g.add(new THREE.Mesh(new THREE.OctahedronGeometry(size, 0), bodyMat));
  const wings = [];
  for (const s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.08, 0.8), wingMat);
    w.position.x = s * (size + 0.45);
    g.add(w); wings.push(w);
  }
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (const s of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 4), eyeMat);
    e.position.set(s * 0.25, 0.3, 0.35 * size); g.add(e);
  }
  g.scale.setScalar(1.3);
  g.userData.wings = wings;
  g.userData.bodyMat = bodyMat;
  return g;
}

const bulletGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.2, 6);
bulletGeo.rotateX(Math.PI / 2);
const pBulletMat = new THREE.MeshBasicMaterial({ color: 0xffff66 });
const eBulletGeo = new THREE.SphereGeometry(0.25, 8, 6);
const eBulletMat = new THREE.MeshBasicMaterial({ color: 0xff5533 });

// ---------- 게임 상태 ----------
const player = makePlayer();
scene.add(player);

let state = 'title'; // title | play | dead | over | clear
let score = 0, hi = +(localStorageGet('galaga3d-hi') || 0), lives = 3, stage = 1;
let enemies = [], pBullets = [], eBullets = [], particles = [];
let fireCooldown = 0, diveTimer = 0, stateTimer = 0, time = 0, formationTime = 0;
const keys = {};

function localStorageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

const $ = id => document.getElementById(id);
const msg = $('msg');
function showMsg(html) { msg.innerHTML = html; msg.style.display = 'flex'; }
function hideMsg() { msg.style.display = 'none'; }
function updateHud() {
  $('score').textContent = score;
  $('hi').textContent = Math.max(hi, score);
  $('stage').textContent = stage;
  $('lives').textContent = '▲'.repeat(Math.max(0, lives - 1));
}

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (state === 'title' || (state === 'over' && stateTimer > 1)) startGame();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

// 터치 지원: 화면 좌/우 터치로 이동, 자동 연사
let touchX = null;
addEventListener('touchstart', e => {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  touchX = e.touches[0].clientX;
  if (state === 'title' || (state === 'over' && stateTimer > 1)) startGame();
}, { passive: true });
addEventListener('touchmove', e => { touchX = e.touches[0].clientX; }, { passive: true });
addEventListener('touchend', () => { touchX = null; });

function clearAll() {
  for (const arr of [enemies, pBullets, eBullets, particles]) {
    for (const o of arr) scene.remove(o.mesh);
    arr.length = 0;
  }
}

function startGame() {
  clearAll();
  score = 0; lives = 3; stage = 1;
  player.visible = true; player.position.set(0, 0, 0);
  spawnWave();
  state = 'play';
  hideMsg(); updateHud();
  beep(523, 0.15); setTimeout(() => beep(659, 0.15), 150); setTimeout(() => beep(784, 0.3), 300);
}

// 편대 위치: z축(깊이)으로 줄을 세운다
function slotPos(e, t) {
  const sway = Math.sin(t * 0.8) * 3;
  const breathe = 1 + Math.sin(t * 1.6) * 0.06;
  return new THREE.Vector3(e.col * breathe * 2.8 + sway, 0, -32 - e.row * 3.6);
}

function spawnWave() {
  const rows = [['boss', 4], ['butterfly', 8], ['butterfly', 8], ['bee', 10], ['bee', 10]];
  let delay = 0;
  rows.forEach(([type, n], r) => {
    for (let i = 0; i < n; i++) {
      const mesh = makeEnemy(type);
      const e = {
        mesh, type, hp: ENEMY_TYPES[type].hp,
        row: 4 - r, col: i - (n - 1) / 2,
        mode: 'enter', t: -delay, side: i % 2 ? 1 : -1,
        vel: new THREE.Vector3(),
      };
      delay += 0.06;
      mesh.position.set(e.side * 40, 0, -110);
      scene.add(mesh);
      enemies.push(e);
    }
  });
  formationTime = 0;
  diveTimer = 3;
}

function explode(pos, color, n = 24) {
  const mat = new THREE.MeshBasicMaterial({ color });
  for (let i = 0; i < n; i++) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), mat);
    mesh.position.copy(pos);
    scene.add(mesh);
    particles.push({
      mesh, life: 0.6 + Math.random() * 0.5,
      vel: new THREE.Vector3((Math.random() - 0.5) * 18, (Math.random() - 0.3) * 12, (Math.random() - 0.5) * 18),
    });
  }
}

function fire() {
  if (pBullets.length >= 3) return; // 갤러그처럼 화면당 탄 수 제한
  for (const dx of [-0.0]) {
    const mesh = new THREE.Mesh(bulletGeo, pBulletMat);
    mesh.position.set(player.position.x + dx, 0, -1.2);
    scene.add(mesh);
    pBullets.push({ mesh });
  }
  beep(880, 0.08, 'square', 0.04, -500);
}

function enemyFire(e) {
  const mesh = new THREE.Mesh(eBulletGeo, eBulletMat);
  mesh.position.copy(e.mesh.position);
  const dir = new THREE.Vector3().subVectors(player.position, mesh.position);
  dir.y = 0; dir.normalize().multiplyScalar(22 + stage * 2);
  scene.add(mesh);
  eBullets.push({ mesh, vel: dir });
}

function killPlayer() {
  explode(player.position, 0xffffff, 40);
  explode(player.position, 0xff3333, 30);
  player.visible = false;
  beep(200, 0.8, 'sawtooth', 0.12, -170);
  lives--;
  updateHud();
  state = lives > 0 ? 'dead' : 'over';
  stateTimer = 0;
  if (state === 'over') {
    if (score > hi) { hi = score; localStorageSet('galaga3d-hi', hi); }
    showMsg(`<h1>GAME OVER</h1><p>SCORE ${score}</p><p class="blink">PRESS SPACE TO RESTART</p>`);
  }
}

// ---------- 업데이트 ----------
function update(dt) {
  time += dt;
  stateTimer += dt;

  // 별 스크롤
  const sp = starGeo.attributes.position.array;
  for (let i = 0; i < STAR_N; i++) {
    sp[i * 3 + 2] += dt * 30;
    if (sp[i * 3 + 2] > 20) sp[i * 3 + 2] -= 170;
  }
  starGeo.attributes.position.needsUpdate = true;

  // 파티클
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.rotation.x += dt * 10;
    p.vel.multiplyScalar(0.96);
    if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
  }

  if (state === 'title') {
    player.rotation.z = Math.sin(time * 2) * 0.3;
    return;
  }

  // 플레이어 이동
  if (player.visible) {
    let dir = 0;
    if (keys.ArrowLeft || keys.KeyA) dir -= 1;
    if (keys.ArrowRight || keys.KeyD) dir += 1;
    if (touchX !== null) dir = touchX < innerWidth / 2 ? -1 : 1;
    player.position.x = THREE.MathUtils.clamp(player.position.x + dir * 16 * dt, -16, 16);
    player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -dir * 0.5, 0.15);

    fireCooldown -= dt;
    if ((keys.Space || touchX !== null) && fireCooldown <= 0 && state === 'play') {
      fire(); fireCooldown = 0.18;
    }
  }

  // 플레이어 탄
  for (let i = pBullets.length - 1; i >= 0; i--) {
    const b = pBullets[i];
    b.mesh.position.z -= 70 * dt;
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (e.mesh.position.distanceTo(b.mesh.position) < 1.4) {
        hit = true;
        e.hp--;
        if (e.hp > 0) {
          e.userHit = 0.2;
          e.mesh.userData.bodyMat.color.set(0x44ddff);
          beep(600, 0.1, 'square', 0.05);
        } else {
          const bonus = e.mode === 'dive' ? 2 : 1;
          score += ENEMY_TYPES[e.type].score * bonus;
          explode(e.mesh.position, ENEMY_TYPES[e.type].body);
          scene.remove(e.mesh);
          enemies.splice(j, 1);
          beep(300, 0.25, 'sawtooth', 0.07, -250);
          updateHud();
        }
        break;
      }
    }
    if (hit || b.mesh.position.z < -120) { scene.remove(b.mesh); pBullets.splice(i, 1); }
  }

  // 적 탄
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.mesh.position.addScaledVector(b.vel, dt);
    if (player.visible && state === 'play' && b.mesh.position.distanceTo(player.position) < 1.1) {
      scene.remove(b.mesh); eBullets.splice(i, 1);
      killPlayer();
      continue;
    }
    if (b.mesh.position.z > 20 || Math.abs(b.mesh.position.x) > 50) { scene.remove(b.mesh); eBullets.splice(i, 1); }
  }

  // 적
  formationTime += dt;
  for (const e of enemies) {
    const m = e.mesh;
    e.t += dt;
    // 날갯짓
    const flap = Math.sin(time * 10 + e.col) * 0.4;
    m.userData.wings[0].rotation.z = flap;
    m.userData.wings[1].rotation.z = -flap;

    if (e.mode === 'enter') {
      if (e.t < 0) continue;
      // 곡선을 그리며 편대 자리로 진입
      const target = slotPos(e, formationTime);
      const k = Math.min(1, e.t / 2.2);
      const arc = Math.sin(k * Math.PI) * 18 * e.side;
      const start = new THREE.Vector3(e.side * 40, 0, -110);
      m.position.lerpVectors(start, target, k * k * (3 - 2 * k));
      m.position.x += arc;
      m.position.y = Math.sin(k * Math.PI) * 6;
      if (k >= 1) e.mode = 'formation';
    } else if (e.mode === 'formation') {
      m.position.lerp(slotPos(e, formationTime), 0.2);
      m.rotation.y = THREE.MathUtils.lerp(m.rotation.y, 0, 0.1);
    } else if (e.mode === 'dive') {
      // 플레이어를 향해 휘어지며 돌진
      const toward = new THREE.Vector3(player.position.x - m.position.x, 0, 0);
      e.vel.x += Math.sign(toward.x) * dt * (20 + stage * 3) + Math.sin(e.t * 4) * dt * 30 * e.side;
      e.vel.x = THREE.MathUtils.clamp(e.vel.x, -14, 14);
      e.vel.z = 20 + stage * 2;
      m.position.addScaledVector(e.vel, dt);
      m.position.y = Math.sin(e.t * 3) * 1.5;
      m.rotation.y = Math.atan2(e.vel.x, e.vel.z) + Math.PI;
      if (e.shots > 0 && Math.random() < dt * 1.5) { enemyFire(e); e.shots--; }
      if (player.visible && state === 'play' && m.position.distanceTo(player.position) < 1.6) {
        explode(m.position, ENEMY_TYPES[e.type].body);
        scene.remove(m);
        e.dead = true;
        killPlayer();
      }
      if (m.position.z > 18) {
        // 화면 밖으로 나가면 뒤쪽에서 다시 편대로 복귀
        e.mode = 'enter'; e.t = 0;
        m.position.set(m.position.x, 0, -110);
      }
    }
    if (e.userHit > 0) {
      e.userHit -= dt;
      if (e.userHit <= 0) m.userData.bodyMat.color.set(ENEMY_TYPES[e.type].body);
    }
  }
  enemies = enemies.filter(e => !e.dead);

  // 돌격 개시
  if (state === 'play') {
    diveTimer -= dt;
    if (diveTimer <= 0) {
      const idle = enemies.filter(e => e.mode === 'formation');
      const count = Math.min(idle.length, 1 + Math.floor(Math.random() * (1 + stage / 2)));
      for (let i = 0; i < count; i++) {
        const e = idle.splice(Math.floor(Math.random() * idle.length), 1)[0];
        e.mode = 'dive'; e.t = 0; e.vel.set(0, 0, 0); e.shots = 1 + Math.floor(stage / 2);
        e.side = Math.random() < 0.5 ? -1 : 1;
        beep(1200, 0.3, 'triangle', 0.03, -900);
      }
      diveTimer = Math.max(0.6, 2.4 - stage * 0.2) + Math.random();
    }
    // 편대에서 간헐적 사격
    if (Math.random() < dt * (0.3 + stage * 0.1)) {
      const shooters = enemies.filter(e => e.mode === 'formation');
      if (shooters.length) enemyFire(shooters[Math.floor(Math.random() * shooters.length)]);
    }
    if (enemies.length === 0) {
      state = 'clear'; stateTimer = 0;
      showMsg(`<h1>STAGE ${stage} CLEAR</h1>`);
      beep(784, 0.2); setTimeout(() => beep(1047, 0.4), 200);
    }
  } else if (state === 'dead' && stateTimer > 2) {
    for (const b of eBullets) scene.remove(b.mesh);
    eBullets.length = 0;
    player.visible = true; player.position.x = 0;
    state = 'play';
  } else if (state === 'clear' && stateTimer > 2) {
    stage++; updateHud(); hideMsg();
    spawnWave();
    state = 'play';
  }
}

// ---------- 루프 ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x * 0.3, 0.05);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
